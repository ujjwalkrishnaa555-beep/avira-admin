<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIRA Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#faf7ff;
  color:#292332;
}

header{
  background:#ffffff;
  padding:20px;
  border-bottom:1px solid #eee4f8;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:2px;
  color:#7954a8;
}

button{
  border:0;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
}

.logout{
  background:#7954a8;
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:25px 16px;
}

.login{
  max-width:400px;
  margin:70px auto;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(80,50,100,.08);
}

.login h2{
  margin-bottom:20px;
  color:#7954a8;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.login button{
  width:100%;
  margin-top:10px;
  background:#7954a8;
  color:white;
}

.error{
  color:#d33;
  margin-top:10px;
}

.dashboard{
  display:none;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:20px 0;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(80,50,100,.06);
}

.stat h3{
  color:#7954a8;
  margin-bottom:8px;
}

.orders{
  display:grid;
  gap:15px;
}

.order{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 5px 20px rgba(80,50,100,.06);
}

.order h3{
  color:#7954a8;
  margin-bottom:8px;
}

.order p{
  margin:5px 0;
}

select{
  padding:9px;
  border-radius:8px;
  border:1px solid #ddd;
  margin-top:10px;
}

@media(max-width:650px){
  .stats{
    grid-template-columns:1fr;
  }

  header{
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">AVIRA</div>
  <button class="logout" id="logoutBtn" style="display:none">
    Logout
  </button>
</header>

<div class="container">

  <!-- LOGIN -->
  <div class="login" id="loginBox">
    <h2>Admin Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Admin email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <div class="error" id="loginError"></div>
  </div>

  <!-- DASHBOARD -->
  <div class="dashboard" id="dashboard">

    <h1>AVIRA Dashboard</h1>

    <div class="stats">

      <div class="stat">
        <h3>Total Orders</h3>
        <strong id="totalOrders">0</strong>
      </div>

      <div class="stat">
        <h3>New Orders</h3>
        <strong id="newOrders">0</strong>
      </div>

      <div class="stat">
        <h3>Delivered</h3>
        <strong id="deliveredOrders">0</strong>
      </div>

    </div>

    <h2 style="margin-bottom:15px;">
      Orders
    </h2>

    <div class="orders" id="orders"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://aflnzgfnpezrkcvgiqkz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1Pc12iP76X83KfQPGA4Suw_U4HkDnix";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// LOGIN
async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    document.getElementById("loginError").textContent =
      error.message;

    return;
  }

  showDashboard();
}


// SHOW DASHBOARD
async function showDashboard(){

  document.getElementById("loginBox").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";

  document.getElementById("logoutBtn").style.display =
    "block";

  loadOrders();
}


// LOAD ORDERS
async function loadOrders(){

  const { data, error } =
    await supabaseClient
      .from("orders")
      .select("*")
      .order("created_at", {
        ascending:false
      });

  if(error){

    document.getElementById("orders").innerHTML =
      "<p>Unable to load orders.</p>";

    return;
  }

  const orders =
    data || [];

  document.getElementById("totalOrders").textContent =
    orders.length;

  document.getElementById("newOrders").textContent =
    orders.filter(
      order => order.status === "Placed"
    ).length;

  document.getElementById("deliveredOrders").textContent =
    orders.filter(
      order => order.status === "Delivered"
    ).length;


  const ordersBox =
    document.getElementById("orders");

  ordersBox.innerHTML = "";


  if(orders.length === 0){

    ordersBox.innerHTML =
      "<p>No orders yet.</p>";

    return;
  }


  orders.forEach(order => {

    const items =
      Array.isArray(order.items)
      ? order.items
      : [];

    let itemsHTML = "";

    items.forEach(item => {

      itemsHTML += `
        <div>
          ${item.name || "Product"}
          × ${item.quantity || 1}
        </div>
      `;

    });


    const card =
      document.createElement("div");

    card.className =
      "order";

    card.innerHTML = `

      <h3>
        Order #${order.id.slice(0,8)}
      </h3>

      <p>
        <strong>Name:</strong>
        ${escapeHTML(order.customer_name)}
      </p>

      <p>
        <strong>Phone:</strong>
        ${escapeHTML(order.phone)}
      </p>

      <p>
        <strong>Address:</strong>
        ${escapeHTML(order.address)}
      </p>

      <p>
        <strong>Payment:</strong>
        ${escapeHTML(order.payment_method)}
      </p>

      <p>
        <strong>Total:</strong>
        ₹${Number(order.total).toFixed(2)}
      </p>

      <p>
        <strong>Products:</strong>
      </p>

      ${itemsHTML}

      <select
        onchange="updateStatus('${order.id}', this.value)"
      >

        <option value="Placed"
          ${order.status === "Placed" ? "selected" : ""}>
          Placed
        </option>

        <option value="Processing"
          ${order.status === "Processing" ? "selected" : ""}>
          Processing
        </option>

        <option value="Shipped"
          ${order.status === "Shipped" ? "selected" : ""}>
          Shipped
        </option>

        <option value="Delivered"
          ${order.status === "Delivered" ? "selected" : ""}>
          Delivered
        </option>

        <option value="Cancelled"
          ${order.status === "Cancelled" ? "selected" : ""}>
          Cancelled
        </option>

      </select>

    `;

    ordersBox.appendChild(card);

  });

}


// UPDATE STATUS
async function updateStatus(id, status){

  const { error } =
    await supabaseClient
      .from("orders")
      .update({
        status:status
      })
      .eq("id", id);

  if(error){

    alert("Update failed");

    return;
  }

  loadOrders();
}


// LOGOUT
document
  .getElementById("logoutBtn")
  .addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

    location.reload();

  });


// CHECK EXISTING SESSION
supabaseClient.auth.getSession()
.then(({ data }) => {

  if(data.session){

    showDashboard();

  }

});


// BASIC HTML ESCAPE
function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
  </html>
